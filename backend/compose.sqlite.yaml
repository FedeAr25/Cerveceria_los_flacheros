services:
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: sqlite:///db.sqlite3
      ALLOWED_HOSTS: localhost,127.0.0.1
    ports:
      - "8000:8000"
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && python manage.py seed_datos && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
